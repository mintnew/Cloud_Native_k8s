name: Update Kubernetes Manifests

on:
  workflow_run:
    workflows: ["cloudnative-platform-image-build"]
    types:
      - completed

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout Repo
        uses: actions/checkout@v3

      # 2. Set Image Tag
      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV

      # 3. Update Image in frontend deployment
      - name: Update Image in YAML
        run: |
          sed -i "s|image: .*|image: <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/${{ secrets.AWS_ECR_REPO }}:$IMAGE_TAG|g" kubernetes/manifests/frontend-deployment.yaml

      # 4. Commit and Push
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add kubernetes/manifests/frontend-deployment.yaml
          git commit -m "Update frontend image to $IMAGE_TAG"
          git push